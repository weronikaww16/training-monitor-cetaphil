name: Monitor terminow treningow

on:
  schedule:
    # Domyślnie: co 15 minut, cały czas
    - cron: "*/15 * * * *"
    # Dodatkowo: co 3 minuty w poniedziałki 8:00-12:00 czasu polskiego
    # (6:00-10:00 UTC - czas letni, UTC+2)
    - cron: "*/3 6-9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz pliki repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj wymagane biblioteki
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Uruchom sprawdzenie strony
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Zapisz nowy stan z powrotem do repozytorium
        run: |
          git config user.name "training-monitor-bot"
          git config user.email "actions@github.com"
          git add state.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Aktualizacja stanu"
          git pull --rebase
          git push
